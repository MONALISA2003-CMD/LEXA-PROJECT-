name: LEXA AI Builder Validation

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lexa-ai-builder-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-source:
    name: Detect imported application source
    runs-on: ubuntu-24.04
    outputs:
      source_present: ${{ steps.detect.outputs.source_present }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Detect API and web source
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f apps/api/pyproject.toml && -f apps/web/package.json && -f apps/web/package-lock.json ]]; then
            echo 'source_present=true' >> "$GITHUB_OUTPUT"
            echo 'Application source is present; AI validation jobs will run.'
          else
            echo 'source_present=false' >> "$GITHUB_OUTPUT"
            echo 'Application source is not imported yet; AI validation jobs will skip cleanly.'
          fi

  ai-api-tests:
    name: AI assistant, grounding, policy and intelligence tests
    needs: detect-source
    if: ${{ needs.detect-source.outputs.source_present == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/api
    env:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://lexa:lexa@localhost:5432/lexa
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: local-ci-only-secret-at-least-32-characters-long
      DATABASE_APP_ROLE: ''
      DATABASE_LOGIN_ROLE: lexa
      PUBLIC_APP_URL: http://localhost:3000
      GEMINI_API_KEY: ''
      GROQ_API_KEY: ''
      CEREBRAS_API_KEY: ''
      OPENROUTER_API_KEY: ''
      HUGGINGFACE_API_KEY: ''
      OPENAI_API_KEY: ''
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install API and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Compile AI/API source
        run: python -m compileall -q app

      - name: Test AI assistant, guardrails, grounding and intelligence
        run: >-
          python -m pytest -q
          tests/test_ai_assistant.py
          tests/test_lexa_assistant_guardrails.py
          tests/test_lexa_business_grounding.py
          tests/test_intelligence_identity.py
          tests/test_intelligence_security.py
          tests/test_intelligence_workflow.py
          tests/test_demand_forecast.py
          tests/test_business_insights.py

  ai-web-contracts:
    name: Verify the web build and frontend contracts
    needs: detect-source
    if: ${{ needs.detect-source.outputs.source_present == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Run frontend contract tests
        run: npm test

      - name: Build production frontend
        run: npm run build
        
