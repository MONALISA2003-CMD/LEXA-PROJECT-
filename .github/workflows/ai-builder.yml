name: LEXA AI Builder Validation

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/app/intelligence/**'
      - 'apps/api/app/routes/ai_assistant.py'
      - 'apps/api/app/business_insights.py'
      - 'apps/api/tests/test_ai_assistant.py'
      - 'apps/api/tests/test_lexa_assistant_guardrails.py'
      - 'apps/api/tests/test_lexa_business_grounding.py'
      - 'apps/api/tests/test_intelligence_*.py'
      - 'apps/api/tests/test_demand_forecast.py'
      - 'apps/api/tests/test_business_insights.py'
      - 'apps/web/**'
  pull_request:
    branches: [main]
    paths:
      - 'apps/api/app/intelligence/**'
      - 'apps/api/app/routes/ai_assistant.py'
      - 'apps/api/app/business_insights.py'
      - 'apps/api/tests/test_ai_assistant.py'
      - 'apps/api/tests/test_lexa_assistant_guardrails.py'
      - 'apps/api/tests/test_lexa_business_grounding.py'
      - 'apps/api/tests/test_intelligence_*.py'
      - 'apps/api/tests/test_demand_forecast.py'
      - 'apps/api/tests/test_business_insights.py'
      - 'apps/web/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lexa-ai-builder-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ai-api-tests:
    name: AI assistant, grounding, policy and intelligence tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api
    env:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://lexa:lexa@localhost:5432/lexa
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: local-ci-only-secret-at-least-32-characters-long
      DATABASE_APP_ROLE: ''
      DATABASE_LOGIN_ROLE: lexa
      PUBLIC_APP_URL: http://localhost:3000
      # Empty provider keys keep this workflow offline/mock-only.
      GEMINI_API_KEY: ''
      GROQ_API_KEY: ''
      CEREBRAS_API_KEY: ''
      OPENROUTER_API_KEY: ''
      HUGGINGFACE_API_KEY: ''
      OPENAI_API_KEY: ''
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install API and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Compile AI/API source
        run: python -m compileall -q app

      - name: Test AI assistant, guardrails, grounding and intelligence
        run: >-
          python -m pytest -q
          tests/test_ai_assistant.py
          tests/test_lexa_assistant_guardrails.py
          tests/test_lexa_business_grounding.py
          tests/test_intelligence_identity.py
          tests/test_intelligence_security.py
          tests/test_intelligence_workflow.py
          tests/test_demand_forecast.py
          tests/test_business_insights.py

  ai-web-contracts:
    name: Verify the web build and frontend contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Run frontend contract tests
        run: npm test

      - name: Build production frontend
        run: npm run build
